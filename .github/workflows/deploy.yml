name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: read is required for checkout once any permission is set.
# pages: write and id-token: write are required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Collect IndexNow URLs
        if: success()
        continue-on-error: true
        run: node scripts/indexnow-urls.mjs dist indexnow/urls.json

      - name: Upload IndexNow URL list
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow/urls.json
          retention-days: 1
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Best-effort. Creating a Pages site needs a token other than
          # GITHUB_TOKEN, so the repo owner may still have to set
          # Settings > Pages > Source to "GitHub Actions" once.
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # After a successful deploy to main. Never fails the deploy.
      - name: Checkout IndexNow key
        if: success()
        continue-on-error: true
        uses: actions/checkout@v7

      - name: Download IndexNow URL list
        if: success()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow

      - name: Submit sitemap URLs to IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs indexnow/urls.json || true
